name: sales-messenger-server
# The project name is deliberately unchanged: renaming it would point Compose at
# fresh, empty volumes and leave the existing database behind.

# Container logs are unbounded by default, and this stack runs on one disk that
# also holds the database and media.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup.sh first}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [database]
    logging: *logging
    # PostgreSQL's entrypoint needs to change file ownership, so capabilities stay.
    security_opt: [no-new-privileges:true]

  synapse:
    image: ghcr.io/element-hq/synapse:v1.161.0
    restart: unless-stopped
    user: "${HOST_UID:?Run setup.sh first}:${HOST_GID:?Run setup.sh first}"
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      - ./data/synapse:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database, edge]
    logging: *logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  push:
    build: ../local/push
    restart: unless-stopped
    user: "${HOST_UID:?Run setup.sh first}:${HOST_GID:?Run setup.sh first}"
    environment:
      PUBLIC_PUSH_GATEWAY_URL: https://${PUBLIC_HOST:?Run setup.sh first}/_matrix/push/v1/notify
      SYNAPSE_URL: http://synapse:8008
      VAPID_SUBJECT: mailto:push@${PUBLIC_HOST:?Run setup.sh first}
    volumes:
      - ./data/push:/data
    depends_on: [synapse]
    networks: [edge]
    logging: *logging
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  admin:
    build:
      context: ../..
      dockerfile: infra/server/Admin.Dockerfile
    restart: unless-stopped
    user: "${HOST_UID:?Run setup.sh first}:${HOST_GID:?Run setup.sh first}"
    environment:
      ADMIN_HOMESERVER_URL: http://synapse:8008
      ADMIN_PUBLIC_DIR: /srv
      ADMIN_AUDIT_PATH: /data/admin-audit.jsonl
      ADMIN_LISTEN_HOST: 0.0.0.0
      ADMIN_SERVER_MODE: "1"
      ADMIN_PUBLIC_HOST: admin.${PUBLIC_HOST:?Run setup.sh first}
    ports:
      - "127.0.0.1:5174:5174"
    volumes:
      - ./web:/srv
      - ./data/admin:/data
    depends_on: [synapse]
    networks: [edge]
    logging: *logging
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Run setup.sh first}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [synapse, push, admin]
    logging: *logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks:
      edge:
        aliases:
          - "${PUBLIC_HOST:?Run setup.sh first}"

  turn:
    image: coturn/coturn:4.18.0-r0
    profiles: [turn]
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data/turn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    read_only: true
    tmpfs: [/tmp, /var/lib/coturn]
    logging: *logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  database:
    internal: true
  edge:
